<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上海景点展示</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <!-- 页眉区域 -->
    <header>
        <h1>上海景点展示</h1>
        <p class="subtitle">热门景点信息与图片</p>
    </header>
    
    <!-- 主内容区域 -->
    <main id="content">
        <section id="scenic-list-section">
            <!-- 搜索框 -->
            <div id="search-container">
                <input type="text" id="search-input" placeholder="搜索景点名称/城市...">
                <button id="search-btn">搜索</button>
            </div>
            <!-- 标签筛选区域 -->
            <div id="tag-filter-container">
                <span class="filter-label">标签筛选：</span>
                <div id="tag-buttons" class="tag-buttons"></div>
                <button id="clear-tags-btn" class="clear-btn">清空筛选</button>
                <button id="reset-btn" class="reset-btn">重置</button>
            </div>
            <!-- 排序区域 -->
            <div id="sort-container">
                <span class="sort-label">排序：</span>
                <select id="sort-select">
                    <option value="default">默认排序</option>
                    <option value="rating-desc">评分：高到低</option>
                    <option value="rating-asc">评分：低到高</option>
                    <option value="price-desc">价格：高到低</option>
                    <option value="price-asc">价格：低到高</option>
                </select>
            </div>
            <!-- 瀑布流景点列表容器 -->
            <div id="scenic-list">
                <div class="masonry-column" id="col-1"></div>
                <div class="masonry-column" id="col-2"></div>
                <div class="masonry-column" id="col-3"></div>
            </div>
        </section>
    </main>
    
    <!-- 页脚区域 -->
    <footer>
        <p>© 2026 景点展示系统</p>
    </footer>
    
    <!-- 景点详情弹窗 -->
    <div id="spot-detail-modal" class="modal">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <button class="modal-close" id="modal-close">&times;</button>
            <div class="modal-body">
                <div class="modal-header">
                    <h2 id="modal-spot-name"></h2>
                    <div class="modal-actions">
                        <button id="modal-favorite-btn" class="favorite-btn">
                            <span class="btn-icon">☆</span>
                            <span class="btn-text">收藏</span>
                        </button>
                        <a id="modal-spot-encyclopedia" href="" target="_blank" class="encyclopedia-btn">
                            <span>📚 百度百科</span>
                            <span class="btn-icon">→</span>
                        </a>
                    </div>
                </div>
                <p id="modal-spot-city" class="modal-city"></p>
                <div class="modal-meta">
                    <span class="meta-item">
                        <span class="meta-label">评分：</span>
                        <span id="modal-spot-rating"></span>
                    </span>
                    <span class="meta-item">
                        <span class="meta-label">票价：</span>
                        <span id="modal-spot-price"></span>
                    </span>
                    <span class="meta-item">
                        <span class="meta-label">开放时间：</span>
                        <span id="modal-spot-open-time"></span>
                    </span>
                </div>
                <div class="modal-tags-container">
                    <span class="meta-label">标签：</span>
                    <span id="modal-spot-tags" class="modal-tags"></span>
                </div>
                <div class="modal-image-container">
                    <img id="modal-spot-image" src="" alt="">
                </div>
                <div class="modal-details">
                    <div class="modal-section">
                        <h3>景点简介</h3>
                        <p id="modal-spot-description"></p>
                    </div>
                    <div class="modal-section">
                        <h3>详细描述</h3>
                        <p id="modal-spot-full-description"></p>
                    </div>
                    <div class="modal-section">
                        <h3>历史沿革</h3>
                        <p id="modal-spot-history"></p>
                    </div>
                    <div class="modal-section">
                        <h3>游玩时长</h3>
                        <p id="modal-spot-play-time"></p>
                    </div>
                    <div class="modal-section">
                        <h3>游览提示</h3>
                        <p id="modal-spot-tips"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 主应用脚本 -->
    <script src="js/app.js"></script>
</body>
</html>
